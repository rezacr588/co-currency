services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - CACHE_TTL=5m
      - FRANKFURTER_URL=https://api.frankfurter.app
    volumes:
      - ./backend:/app
    command: go run ./cmd/api
