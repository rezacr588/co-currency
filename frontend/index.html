    <!-- JSON-LD Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Currency Converter",
      "description": "Free online currency converter with real-time exchange rates. Convert between USD, EUR, GBP, JPY, IRR and 30+ world currencies.",
      "url": "https://currency-converter.app/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time exchange rates",
        "30+ currencies supported",
        "Historical rate lookup",
        "Offline support via PWA",
        "Multi-language support"
      ],
      "screenshot": "https://currency-converter.app/og-image.png",
      "softwareVersion": "1.0.0",
      "author": {
        "@type": "Organization",
        "name": "Currency Converter",
        "url": "https://currency-converter.app"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1250"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How accurate are the exchange rates?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our exchange rates are updated daily from the Frankfurter API, which sources data from the European Central Bank. Rates are highly accurate for major currency pairs."
          }
        },
        {
          "@type": "Question",
          "name": "Which currencies are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We support 30+ major world currencies including USD, EUR, GBP, JPY, CHF, CAD, AUD, CNY, IRR, and many more."
          }
        },
        {
          "@type": "Question",
          "name": "Is this currency converter free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, our currency converter is completely free to use with no registration required."
          }
        },
        {
          "@type": "Question",
          "name": "How often are exchange rates updated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Exchange rates are updated daily on business days, sourced from the European Central Bank."
          }
        }
      ]
    }
    </script>

    <!-- JSON-LD Structured Data: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

          "position": 1,
          "name": "Home",
          "item": "https://currency-converter.app/"
