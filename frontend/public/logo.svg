<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="24" cy="24" r="22" fill="url(#logoGradient)"/>
  <!-- Currency Symbol C -->
  <path d="M28 16c-4.5-2-9.5-1-12 3s-1.5 9 3 11c2 1 4.5 1 6.5 0" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Growth Arrow -->
  <path d="M30 28l5-5m0 0v4m0-4h-4" stroke="url(#arrowGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal Lines (financial chart) -->
  <line x1="16" y1="34" x2="32" y2="34" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="36.5" x2="30" y2="36.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
