<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Modern rounded square background -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#mainGradient)"/>

  <!-- Currency exchange symbol - stylized arrows forming infinity/exchange -->
  <g transform="translate(24, 24)">
    <!-- Right arrow (outward) -->
    <path d="M -8 -6 L 2 -6 L 2 -8 L 6 -5 L 2 -2 L 2 -4 L -8 -4 Z"
          fill="white" opacity="0.95"/>

    <!-- Left arrow (inward) -->
    <path d="M 8 6 L -2 6 L -2 8 L -6 5 L -2 2 L -2 4 L 8 4 Z"
          fill="url(#accentGradient)"/>

    <!-- Currency symbols integrated -->
    <circle cx="-10" cy="-5" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="10" cy="5" r="1.5" fill="#10b981" opacity="0.8"/>

    <!-- Modern accent line -->
    <line x1="-12" y1="0" x2="12" y2="0"
          stroke="white" stroke-width="0.5"
          opacity="0.3" stroke-dasharray="1,2"/>
  </g>

  <!-- Bottom accent - financial bar chart style -->
  <g opacity="0.25">
    <rect x="8" y="38" width="2" height="6" rx="1" fill="white"/>
    <rect x="14" y="36" width="2" height="8" rx="1" fill="white"/>
    <rect x="20" y="34" width="2" height="10" rx="1" fill="white"/>
    <rect x="26" y="36" width="2" height="8" rx="1" fill="white"/>
    <rect x="32" y="35" width="2" height="9" rx="1" fill="white"/>
    <rect x="38" y="37" width="2" height="7" rx="1" fill="white"/>
  </g>
</svg>
