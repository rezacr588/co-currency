<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 0h1200v630H0z" fill="none" stroke="#fff" stroke-width="1"/>
    <path d="M100 0v630M200 0v630M300 0v630M400 0v630M500 0v630M600 0v630M700 0v630M800 0v630M900 0v630M1000 0v630M1100 0v630" stroke="#fff" stroke-width="0.5"/>
    <path d="M0 63h1200M0 126h1200M0 189h1200M0 252h1200M0 315h1200M0 378h1200M0 441h1200M0 504h1200M0 567h1200" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="200" fill="url(#logoGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="url(#logoGradient)" opacity="0.1"/>

  <!-- Logo Circle -->
  <g transform="translate(500, 180)">
    <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" filter="drop-shadow(0 20px 40px rgba(99, 102, 241, 0.4))"/>
    <!-- Currency Symbol C -->
    <path d="M116 60c-18.5-8-39-4-49 12s-6 37 12 45c8 4 18.5 4 26.5 0" stroke="white" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Growth Arrow -->
    <path d="M125 110l20-20m0 0v16m0-16h-16" stroke="url(#arrowGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal Lines -->
    <line x1="66" y1="150" x2="134" y2="150" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <line x1="74" y1="162" x2="126" y2="162" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">
    CoFinance
  </text>

  <!-- Subtitle -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Real-Time Currency Converter
  </text>

  <!-- Features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">
    <text x="400" y="540" text-anchor="middle">160+ Currencies</text>
    <text x="600" y="540" text-anchor="middle">Real-Time Rates</text>
    <text x="800" y="540" text-anchor="middle">Free & Fast</text>
  </g>

  <!-- Dots between features -->
  <circle cx="500" cy="536" r="3" fill="#6366f1"/>
  <circle cx="700" cy="536" r="3" fill="#6366f1"/>

  <!-- URL -->
  <text x="600" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6366f1" text-anchor="middle">
    cofinance.app
  </text>
</svg>
