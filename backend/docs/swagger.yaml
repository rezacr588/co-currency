  github_com_rezacr588_currency-converter_internal_model.UpdateSubscriptionRequest:
    properties:
      amount:
        type: number
      billing_cycle:
        type: string
      category:
        type: string
      currency:
        type: string
      logo_url:
        type: string
      name:
        type: string
      next_billing_date:
        type: string
      notes:
        type: string
      reminder_days:
        type: integer
      status:
        type: string
