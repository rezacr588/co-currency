basePath: /api/v1
definitions:
  github_com_rezacr588_currency-converter_internal_model.CreateSubscriptionRequest:
    properties:
      amount:
        type: number
      billing_cycle:
        type: string
      category:
        type: string
      currency:
        type: string
      logo_url:
        type: string
      name:
        type: string
      next_billing_date:
        description: ISO date format
        type: string
      notes:
        type: string
      reminder_days:
        type: integer
    type: object
  github_com_rezacr588_currency-converter_internal_model.Subscription:
    properties:
      amount:
        type: number
      billing_cycle:
        description: weekly, monthly, quarterly, yearly
        type: string
      category:
        description: streaming, software, gaming, fitness, utilities, etc.
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      logo_url:
        type: string
      name:
        type: string
      next_billing_date:
        type: string
      notes:
        type: string
      reminder_days:
        type: integer
      status:
        description: active, paused, cancelled
        type: string
      updated_at:
        type: string
      user_id:
        type: string
