host: localhost:8080
info:
  contact:
    email: support@coai.app
    name: API Support
    url: https://github.com/rezacr588/currency-converter
  description: |-
    CoAI is a personal finance management API with currency conversion, wallet management, budgets, goals, subscriptions, and achievement badges.

    ## Features
    - **Currency Conversion**: Real-time exchange rates with support for 30+ currencies including IRR
    - **Wallet Management**: Multi-currency wallet with transaction tracking
    - **Budgets**: Set and track spending budgets by category
    - **Goals**: Create and track financial savings goals
    - **Subscriptions**: Track recurring subscriptions and bills
    - **Badges**: Earn achievement badges for financial milestones
    - **AI Features**: Smart transaction parsing and categorization

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    `Authorization: Bearer <your-token>`
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: CoAI API
  version: "1.0"
paths:
  /badges:
    get:
      consumes:
      - application/json
      description: Get a list of all system badges
      produces:
      - application/json
      responses:
        "200":
          description: 'badges: []model.Badge'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all available badges
      tags:
      - Badges
  /badges/check:
    post:
      consumes:
      - application/json
      description: Trigger a check for newly earned badges based on user stats
      produces:
      - application/json
      responses:
        "200":
          description: 'newly_earned: []model.UserBadge, total_earned: int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check for new badges
      tags:
      - Badges
  /badges/earned:
    get:
      consumes:
      - application/json
      description: Get badges earned by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: 'badges: []model.UserBadge, count: int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get earned badges
      tags:
      - Badges
  /badges/progress:
    get:
      consumes:
      - application/json
      description: Get progress towards all badges for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: 'progress: []model.BadgeProgress, total_badges: int, earned_count:
            int'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get badge progress
      tags:
      - Badges
  /subscriptions:
    get:
      consumes:
      - application/json
      description: Get a list of all subscriptions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: 'subscriptions: []model.Subscription'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all subscriptions
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: Create a new subscription
      parameters:
      - description: Subscription details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezacr588_currency-converter_internal_model.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_rezacr588_currency-converter_internal_model.Subscription'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a subscription
      tags:
      - Subscriptions
  /subscriptions/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a subscription by ID
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: subscription deleted successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Subscription not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a subscription
      tags:
      - Subscriptions
    get:
      consumes:
      - application/json
      description: Get details of a specific subscription by ID
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rezacr588_currency-converter_internal_model.Subscription'
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Subscription not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a subscription
      tags:
      - Subscriptions
    put:
      consumes:
      - application/json
      description: Update details of an existing subscription
      parameters:
      - description: Subscription ID
        in: path
        name: id
        required: true
        type: string
      - description: Update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_rezacr588_currency-converter_internal_model.UpdateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rezacr588_currency-converter_internal_model.Subscription'
        "400":
          description: Invalid request or ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Subscription not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a subscription
      tags:
      - Subscriptions
  /subscriptions/billing-cycles:
    get:
      consumes:
      - application/json
      description: Get list of supported billing cycles
      produces:
      - application/json
      responses:
        "200":
          description: 'billing_cycles: []string'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get billing cycles
      tags:
      - Subscriptions
  /subscriptions/categories:
    get:
      consumes:
      - application/json
      description: Get list of supported subscription categories
      produces:
      - application/json
      responses:
        "200":
          description: 'categories: []string'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get subscription categories
      tags:
      - Subscriptions
  /subscriptions/summary:
    get:
      consumes:
      - application/json
      description: Get a summary of subscription costs (monthly/yearly)
      parameters:
      - description: 'Currency code (default: USD)'
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rezacr588_currency-converter_internal_model.SubscriptionSummary'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get subscription summary
      tags:
      - Subscriptions
  /subscriptions/upcoming:
    get:
      consumes:
      - application/json
      description: Get subscriptions renewing in the next N days
      parameters:
      - description: 'Number of days to check (default: 7)'
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get upcoming renewals
      tags:
      - Subscriptions
securityDefinitions:
  BearerAuth:
    description: Enter your JWT token with the `Bearer ` prefix, e.g. "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    in: header
    name: Authorization
    type: apiKey
