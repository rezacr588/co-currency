name: Koyeb Keepalive

on:
  schedule:
    # Koyeb free tier scales to zero after ~5 min idle. Ping every 10 min on
    # odd minute offsets to avoid the crowded :00/:15/:30/:45 slots where
    # GitHub Actions cron firings are routinely delayed 10-30+ min.
    # UptimeRobot (5-min interval) is the primary keep-warm; this is backup.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Koyeb Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping public health endpoint over HTTP/1.1
        env:
          HEALTH_URL: https://coai.koyeb.app/health
        run: |
          for attempt in 1 2 3; do
            echo "Ping attempt ${attempt}/3"

            if curl \
              --http1.1 \
              --fail \
              --silent \
              --show-error \
              --max-time 90 \
              "$HEALTH_URL" > /dev/null; then
              echo "Koyeb health check succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Ping failed, waiting before retry..."
              sleep 20
            fi
          done

          # Exit 0 even on failure: a single missed cold-start shouldn't mark
          # the workflow red and spam notifications. UptimeRobot is the real
          # uptime monitor. Surface the miss via the log, not the run status.
          echo "::warning::Koyeb health check failed after 3 attempts."
          exit 0
