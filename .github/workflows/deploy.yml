name: Deploy to Koyeb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Test Backend
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: ./backend
        run: go test -short ./...

      # Test Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | bash
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          # Check if service exists
          if koyeb service get currency-converter/currency-converter 2>/dev/null; then
            echo "Service exists, redeploying..."
            koyeb service redeploy currency-converter/currency-converter
          else
            echo "Service does not exist. Please create it first via Koyeb console."
            echo "1. Go to https://app.koyeb.com"
            echo "2. Create new app from GitHub"
            echo "3. Select this repository"
            echo "4. Use Dockerfile builder"
            echo "5. Set port to 8080"
            exit 1
          fi
