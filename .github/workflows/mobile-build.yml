name: Mobile Build & Update

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      build_apk:
        description: 'Build new APK (only needed for native changes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  # Detect if native files changed (requires new APK build)
  detect-native-changes:
    name: Detect Native Changes
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.check.outputs.native_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for native file changes
        id: check
        run: |
          # Files that require a new native build when changed
          # package.json is handled separately below to avoid rebuilding for non-native edits
          NATIVE_FILES="app/app.json app/eas.json"

          # Check if any native files changed in this commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          NATIVE_CHANGED="false"
          for file in $NATIVE_FILES; do
            if echo "$CHANGED" | grep -q "^$file$"; then
              echo "Native file changed: $file"
              NATIVE_CHANGED="true"
            fi
          done

          # Check for native dependency changes in package.json
          if echo "$CHANGED" | grep -q "^app/package.json$"; then
            # Trigger APK build only when Expo/React Native dependencies changed
            if git diff HEAD~1 HEAD -- app/package.json | grep -E '^[+-].*"(expo-|react-native|@expo)' > /dev/null 2>&1; then
              echo "Native dependency changed in app/package.json"
              NATIVE_CHANGED="true"
            fi
          fi

          echo "native_changed=$NATIVE_CHANGED" >> $GITHUB_OUTPUT
          echo "Native changed: $NATIVE_CHANGED"

  # OTA Update - Runs on every push (fast, ~1-2 min)
  # Users with the app installed get updates automatically
  ota-update:
    name: Push OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Lint app
        working-directory: ./app
        run: npm run lint

      - name: Typecheck app
        working-directory: ./app
        run: npm run typecheck

      - name: Push OTA Update
        working-directory: ./app
        run: eas update --branch production --message "Auto update from commit ${{ github.sha }}"

  # APK Build - Runs when:
  # 1. Manual trigger with build_apk=true
  # 2. Commit message contains [build-apk]
  # 3. Native files changed (package.json, app.json, eas.json, or native dependencies)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: detect-native-changes
    if: |
      github.event.inputs.build_apk == 'true' ||
      contains(github.event.head_commit.message, '[build-apk]') ||
      needs.detect-native-changes.outputs.native_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Lint app
        working-directory: ./app
        run: npm run lint

      - name: Typecheck app
        working-directory: ./app
        run: npm run typecheck

      - name: Bump version
        working-directory: ./app
        run: |
          node scripts/bump-version.js build
          echo "Version bumped for build"

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/app.json
          git diff --staged --quiet || git commit -m "chore: bump version for build [skip ci]"
          git push || echo "Nothing to push"

      - name: Build Android APK
        working-directory: ./app
        run: eas build --platform android --profile apk --non-interactive

      - name: Download APK from EAS
        if: success()
        working-directory: ./app
        run: |
          BUILD_ID=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | jq -r '.[0].id')
          echo "Downloading build $BUILD_ID..."
          mkdir -p ../artifacts
          eas build:download --id "$BUILD_ID" --output ../artifacts/coai.apk --non-interactive

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CoAI Latest Build
          body: |
            Latest Android APK build.
            Commit: ${{ github.sha }}
            Built: ${{ github.event.head_commit.timestamp }}

            **Install:** Download `coai.apk` and open it on your Android device.
          files: artifacts/coai.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: success()
        working-directory: ./app
        run: |
          echo "## Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK uploaded to GitHub Releases: https://github.com/rezacr588/co-currency/releases/tag/latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct download: https://github.com/rezacr588/co-currency/releases/download/latest/coai.apk" >> $GITHUB_STEP_SUMMARY
