name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fast deploy - skip tests for speed
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN }}

      - name: Pre-deploy database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client > /dev/null
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            pg_dump "$DATABASE_URL" --no-owner --no-privileges --clean --if-exists | gzip > "pre-deploy-backup_${TIMESTAMP}.sql.gz"
            echo "Pre-deploy backup created"
          else
            echo "DATABASE_URL not set, skipping backup"
          fi

      - name: Upload pre-deploy backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: pre-deploy-backup_*.sql.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Validate deployment secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "Missing required secret: JWT_SECRET"
            exit 1
          fi

      - name: Deploy to Koyeb
        timeout-minutes: 10
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          # Retry deploy to absorb transient Koyeb/API TLS/network issues.
          attempts=4
          delay=10

          env_flags=(
            --env PORT=8080
            --env ENVIRONMENT=production
            --env EXPOSE_ERROR_DETAILS=false
            --env "JWT_SECRET=$JWT_SECRET"
          )

          if [ -n "$FRONTEND_URL" ]; then
            env_flags+=(--env "FRONTEND_URL=$FRONTEND_URL")
          fi
          if [ -n "$DATABASE_URL" ]; then
            env_flags+=(--env "DATABASE_URL=$DATABASE_URL")
          fi
          if [ -n "$REDIS_URL" ]; then
            env_flags+=(--env "REDIS_URL=$REDIS_URL")
            env_flags+=(--env WS_REDIS_CHANNEL=ws_events)
          fi

          for i in $(seq 1 "$attempts"); do
            echo "Deploy attempt ${i}/${attempts}..."
            if koyeb service update coai/co-currency \
              --docker ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              "${env_flags[@]}"; then
              echo "Deploy succeeded on attempt ${i}."
              exit 0
            fi

            if [ "$i" -lt "$attempts" ]; then
              echo "Deploy attempt ${i} failed. Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "Deploy failed after ${attempts} attempts."
          exit 1

  # Tests run in parallel but don't block deploy
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Test Backend
        working-directory: ./backend
        run: go test ./...

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      - name: Typecheck App
        working-directory: ./app
        run: npm run typecheck

      - name: Lint App
        working-directory: ./app
        run: npm run lint

      - name: Test App
        working-directory: ./app
        run: npm test -- --ci --maxWorkers=2
