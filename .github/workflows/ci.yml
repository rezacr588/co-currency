name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fast deploy - skip tests for speed
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Install Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_TOKEN }}

      - name: Deploy to Koyeb
        timeout-minutes: 10
        run: |
          # Retry deploy to absorb transient Koyeb/API TLS/network issues.
          attempts=4
          delay=10
          for i in $(seq 1 "$attempts"); do
            echo "Deploy attempt ${i}/${attempts}..."
            if koyeb service update terrible-moselle/co-currency \
              --docker ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}; then
              echo "Deploy succeeded on attempt ${i}."
              exit 0
            fi

            if [ "$i" -lt "$attempts" ]; then
              echo "Deploy attempt ${i} failed. Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "Deploy failed after ${attempts} attempts."
          exit 1

  # Tests run in parallel but don't block deploy
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Test Backend
        working-directory: ./backend
        run: go test ./...

      - name: Typecheck App
        working-directory: ./app
        run: |
          npm ci
          npm run typecheck
